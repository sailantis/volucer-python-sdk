[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volucer-worker"
version = "0.1.0"
description = "A Python worker SDK for the volucer worker protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
]

[project.urls]
Specification = "https://github.com/sailantis/volucer/blob/main/docs/worker-protocol.md"
Repository = "https://github.com/sailantis/volucer-python-sdk"

[tool.setuptools]
packages = ["volucer_worker"]

[tool.setuptools.package-data]
volucer_worker = ["py.typed"]


[tool.ruff]
line-length = 96
target-version = "py310"
